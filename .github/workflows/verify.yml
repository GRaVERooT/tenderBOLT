name: Verify tenderBOLT static MVP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s styles.css
          test -s classic.html
          test -s prototype.js
          test -s prototype.css
          test -s tests/prototype-smoke.cjs
          test -s MANUAL.md
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check prototype.js
          node --check tests/prototype-smoke.cjs
          node tests/prototype-smoke.cjs
      - name: Check six-stage UI labels
        run: |
          grep -q 'Обзор' app.js
          grep -q 'Подключение к источникам' app.js
          grep -q 'Сбор лотов' app.js
          grep -q 'Анализ ТЗ' app.js
          grep -q 'Отбор' app.js
          grep -q 'Предложение' app.js
          grep -q 'Контроль' app.js
      - name: Check Goszakup links, AI prompt, and no synthetic fixtures
        run: |
          grep -q 'lotUrl' app.js
          grep -q 'tzUrl' app.js
          grep -q 'promptFor' app.js
          grep -q 'indexedDB.open' app.js
          ! grep -q 'function seedLots' app.js

      - name: Confirm public entry references new static prototype, not backend secrets
        run: |
          grep -q 'prototype.css' index.html
          grep -q 'prototype.js' index.html
          grep -q 'styles.css' classic.html
          grep -q 'app.js' classic.html
          ! grep -q 'TENANT_TOKEN_ENCRYPTION_KEY' prototype.js
          ! grep -q 'GOSZAKUP_API_TOKEN' prototype.js
          ! grep -q 'api_token"' prototype.js
